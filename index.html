<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'none'" />
  <title>בונה המולקולות</title>
  <meta name="description" content="משחק לבניית מולקולות לילדים" />
  <meta name="theme-color" content="#f3f6f9" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preload" href="fonts/secular-one-hebrew.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/varela-round-hebrew.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/board.css" />
  <link rel="stylesheet" href="css/screens.css" />
</head>
<body>
  <header class="topbar">
    <span class="wordmark">בונה המולקולות</span>
    <nav class="tabs" role="tablist" aria-label="מסכים">
      <button class="tab" role="tab" id="tab-build" aria-controls="screen-build" aria-selected="true">בנייה</button>
      <button class="tab" role="tab" id="tab-challenges" aria-controls="screen-challenges" aria-selected="false" tabindex="-1">אתגרים</button>
      <button class="tab" role="tab" id="tab-atoms" aria-controls="screen-atoms" aria-selected="false" tabindex="-1">אטומים</button>
    </nav>
    <span class="stars" id="stars" aria-live="polite"><span class="star" aria-hidden="true"></span><span id="stars-count">0</span></span>
  </header>

  <main>
    <section id="screen-build" class="screen build" role="tabpanel" aria-labelledby="tab-build">
      <div class="tray" id="tray" aria-label="אטומים"></div>

      <div class="stage">
        <div class="challenge-bar" id="challenge-bar" hidden></div>
        <div class="board" id="board">
          <svg class="bond-layer" id="bond-layer" aria-hidden="true"></svg>
          <div class="atom-layer" id="atom-layer"></div>
          <div class="board-empty" id="board-empty">
            <span class="board-empty-atoms" aria-hidden="true">
              <span class="ball" data-symbol="H">H</span><span class="ball" data-symbol="O">O</span><span class="ball" data-symbol="H">H</span>
            </span>
            <span>הקישו על אטום כדי להתחיל</span>
          </div>
          <div class="burst" id="burst" aria-hidden="true"></div>
        </div>
        <div class="toolbar">
          <button type="button" class="btn" id="btn-undo">
            <span class="icon-flip"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></span>
            בטל
          </button>
          <button type="button" class="btn" id="btn-clear">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>
            נקה
          </button>
          <button type="button" class="btn btn-primary" id="btn-check">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg>
            בדוק
          </button>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </div>

      <aside class="panel" id="panel" aria-label="המולקולה">
        <button type="button" class="panel-close" id="panel-close" aria-label="סגור">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <div class="panel-body" id="panel-body"></div>
        <div class="viewer" id="viewer">
          <canvas class="viewer-canvas" id="viewer-canvas" aria-label="המולקולה בתלת־ממד"></canvas>
          <p class="viewer-empty" id="viewer-empty">השלימו מולקולה כדי לראות אותה בתלת־ממד</p>
          <div class="seg viewer-mode" role="group" aria-label="סוג תצוגה">
            <button type="button" data-mode="stick" aria-pressed="true">כדור־מקל</button>
            <button type="button" data-mode="fill" aria-pressed="false">מלא</button>
          </div>
        </div>
      </aside>
    </section>

    <section id="screen-challenges" class="screen" role="tabpanel" aria-labelledby="tab-challenges" hidden>
      <div class="progress-head">
        <span id="progress-text"></span>
        <div class="progress" aria-hidden="true"><span id="progress-fill"></span></div>
      </div>
      <div id="challenge-levels"></div>
    </section>

    <section id="screen-atoms" class="screen" role="tabpanel" aria-labelledby="tab-atoms" hidden>
      <div class="atom-cards" id="atom-cards"></div>
    </section>
  </main>

  <div class="update-banner" id="update-banner" hidden>
    <span>יש גרסה חדשה</span>
    <button type="button" id="update-reload">רענן</button>
  </div>

  <script src="vendor/three.min.js"></script>
  <script src="vendor/OrbitControls.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>

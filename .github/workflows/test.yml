name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # אין package.json ואין תלויות: הבדיקות רצות ישירות על מודולי הליבה
      - run: node --test tests/*.test.mjs
